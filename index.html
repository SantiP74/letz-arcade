<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lëtz Hang-On - Grand Duchy Tour</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body {
      background: #0b1329;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 720px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #flag-top {
      height: 6px;
      width: 100%;
      display: flex;
      flex-shrink: 0;
    }
    .fl-r { flex: 1; background: #EA141D; }
    .fl-w { flex: 1; background: #FFFFFF; }
    .fl-b { flex: 1; background: #00A1DE; }

    #hud {
      position: absolute;
      top: 6px;
      left: 0;
      right: 0;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 19, 41, 0.85);
      border-bottom: 2px solid #334155;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.5px;
      z-index: 10;
    }
    .hud-val-spd { color: #00A1DE; font-size: 16px; }
    .hud-val-sc { color: #EA141D; font-size: 16px; }

    canvas {
      flex: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 19, 41, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 30;
    }
    #overlay h1 {
      font-size: 28px;
      font-weight: 900;
      color: #00A1DE;
      text-shadow: 0 0 15px rgba(0,161,222,0.5);
      margin-bottom: 8px;
    }
    #overlay p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-act {
      background: linear-gradient(135deg, #EA141D, #00A1DE);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0,161,222,0.4);
      cursor: pointer;
    }

    #touch-panel {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 12px;
      z-index: 20;
    }
    .t-btn {
      flex: 1;
      padding: 18px 0;
      font-size: 18px;
      font-weight: 900;
      background: rgba(30, 41, 59, 0.88);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 2px solid #00A1DE;
      border-radius: 12px;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .t-btn:active { background: #00A1DE; color: #0b1329; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="flag-top">
      <div class="fl-r"></div>
      <div class="fl-w"></div>
      <div class="fl-b"></div>
    </div>

    <div id="hud">
      <div>SPEED: <b id="spd" class="hud-val-spd">0</b> KM/H</div>
      <div>SCORE: <b id="sc" class="hud-val-sc">0</b></div>
    </div>

    <canvas id="c" width="480" height="640"></canvas>

    <div id="overlay">
      <h1>SUPER LËTZ-ON 🏍️</h1>
      <p>Super Hang-On Luxembourg Tour!<br>Lean into Ardennes hills & curves, dodge traffic, grab the <b>Roude Léiw</b>!</p>
      <button class="btn-act" id="btn-start">START RACE 🏁</button>
    </div>

    <div id="touch-panel">
      <button class="t-btn" id="b-left">◀ LEAN LEFT</button>
      <button class="t-btn" id="b-right">LEAN RIGHT ▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const spdEl = document.getElementById("spd");
    const scEl = document.getElementById("sc");
    const overlay = document.getElementById("overlay");
    const btnStart = document.getElementById("btn-start");
    const bLeft = document.getElementById("b-left");
    const bRight = document.getElementById("b-right");

    const W = 480, H = 640;
    const HORIZON = 240;
    let running = false;
    let speed = 0, maxSpeed = 220;
    let score = 0, pos = 0, playerX = 0, lean = 0;
    let steerDir = 0;

    // Generazione tracciato stile Out Run (colline e curve)
    const segLength = 200;
    const totalSegments = 400;
    const segments = [];

    for (let i = 0; i < totalSegments; i++) {
      let curve = 0;
      let y = 0;

      // Curve
      if (i > 30 && i < 80) curve = 2.8;
      if (i > 110 && i < 170) curve = -3.2;
      if (i > 210 && i < 270) curve = 3.6;

      // Colline (saliscendi)
      if (i > 50 && i < 100) y = Math.sin((i - 50) / 50 * Math.PI) * 700;
      if (i > 150 && i < 220) y = Math.sin((i - 150) / 70 * Math.PI) * 900;

      segments.push({
        index: i,
        z: i * segLength,
        y: y,
        curve: curve,
        tree: (i % 6 === 0) ? (i % 12 === 0 ? 1.6 : -1.6) : 0,
        car: (i > 15 && i % 18 === 0) ? { offset: (Math.random() * 1.3 - 0.65), type: 'car' } : null,
        bonus: (i > 10 && i % 22 === 0) ? { offset: (Math.random() * 1.1 - 0.55) } : null
      });
    }

    function start() {
      running = true;
      speed = 70;
      score = 0;
      pos = 0;
      playerX = 0;
      lean = 0;
      steerDir = 0;
      overlay.style.display = "none";
    }

    function crash() {
      running = false;
      speed = 0;
      overlay.style.display = "flex";
      overlay.querySelector("h1").innerText = "ACCIDENT! 💥";
      overlay.querySelector("p").innerText = "Final Score: " + score;
      btnStart.innerText = "PLAY AGAIN 🔄";
    }

    btnStart.addEventListener("click", start);
    btnStart.addEventListener("touchstart", (e) => { e.preventDefault(); start(); });

    function bindSteer(el, dir) {
      el.addEventListener("touchstart", (e) => { e.preventDefault(); steerDir = dir; }, { passive: false });
      el.addEventListener("touchend", (e) => { e.preventDefault(); if (steerDir === dir) steerDir = 0; });
      el.addEventListener("mousedown", () => { steerDir = dir; });
      el.addEventListener("mouseup", () => { if (steerDir === dir) steerDir = 0; });
      el.addEventListener("mouseleave", () => { if (steerDir === dir) steerDir = 0; });
    }
    bindSteer(bLeft, -1);
    bindSteer(bRight, 1);

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") steerDir = -1;
      if (e.code === "ArrowRight" || e.code === "KeyD") steerDir = 1;
      if (e.code === "Space" && !running) start();
    });
    window.addEventListener("keyup", (e) => {
      if ((e.code === "ArrowLeft" || e.code === "KeyA") && steerDir === -1) steerDir = 0;
      if ((e.code === "ArrowRight" || e.code === "KeyD") && steerDir === 1) steerDir = 0;
    });

    // Loop Logico
    setInterval(() => {
      if (!running) return;

      if (speed < maxSpeed) speed += 0.6;
      pos += speed * 2.2;

      // Sterzata e Piega fisica
      if (steerDir !== 0) {
        playerX += steerDir * 0.038;
        lean += (steerDir * 0.45 - lean) * 0.28;
      } else {
        lean *= 0.82;
      }

      // Rallenta sull'erba se esci di pista
      if (playerX < -1.1 || playerX > 1.1) {
        speed *= 0.97;
        if (speed < 45) speed = 45;
      }

      score += Math.floor(speed / 30);
      spdEl.innerText = Math.floor(speed);
      scEl.innerText = score;

      const curSeg = segments[Math.floor(pos / segLength) % segments.length];
      playerX -= (curSeg.curve * 0.003) * (speed / maxSpeed);

      // Collisioni
      if (curSeg.car && Math.abs(playerX - curSeg.car.offset) < 0.28) {
        crash();
        return;
      }
      if (curSeg.bonus && Math.abs(playerX - curSeg.bonus.offset) < 0.35) {
        score += 200;
        scEl.innerText = score;
        curSeg.bonus = null;
      }
    }, 1000 / 60);

    // Disegno Albero Ardenne stile rétro
    function drawTree(ctx, x, y, scale) {
      if (scale <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale * 1.5, scale * 1.5);
      // Tronco
      ctx.fillStyle = "#451a03";
      ctx.fillRect(-6, -30, 12, 30);
      // Chioma
      ctx.fillStyle = "#14532d";
      ctx.beginPath();
      ctx.arc(0, -60, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#166534";
      ctx.beginPath();
      ctx.arc(-8, -64, 18, 0, Math.PI * 2);
      ctx.arc(8, -64, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Disegno Auto Rétro del traffico
    function drawCar(ctx, x, y, scale) {
      if (scale <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale * 1.7, scale * 1.7);
      // Ombra
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.ellipse(0, 0, 24, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      // Carrozzeria Rossa
      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.roundRect(-22, -26, 44, 24, 5);
      ctx.fill();
      // Lunotto Posteriore
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-16, -23, 32, 11);
      // Ruote
      ctx.fillStyle = "#111";
      ctx.fillRect(-22, -8, 8, 8);
      ctx.fillRect(14, -8, 8, 8);
      // Fari Posteriori Accesi
      ctx.fillStyle = "#facc15";
      ctx.fillRect(-19, -12, 7, 5);
      ctx.fillRect(12, -12, 7, 5);
      ctx.restore();
    }

    // Disegno Moto in Piega Super Hang-On
    function drawBike(ctx, x, y, tilt) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);

      // Ombra asfalto
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.beginPath();
      ctx.ellipse(0, 4, 30, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ruotone posteriore slick
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-12, -42, 24, 44);
      ctx.fillStyle = "#334155"; // Cerchio in lega
      ctx.fillRect(-5, -34, 10, 28);

      // Scarico cromato doppio
      ctx.fillStyle = "#cbd5e1";
      ctx.fillRect(12, -26, 6, 22);
      ctx.fillStyle = "#334155";
      ctx.fillRect(13, -6, 4, 3);

      // Carena & Forcellone Celeste (#00A1DE) e Rosso (#EA141D)
      ctx.fillStyle = "#00A1DE";
      ctx.beginPath();
      ctx.roundRect(-16, -58, 32, 24, 4);
      ctx.fill();
      ctx.fillStyle = "#EA141D";
      ctx.fillRect(-12, -54, 24, 8);

      // Fanale Posteriore Led
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(-8, -36, 16, 4);

      // Manubrio largo
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(-24, -64, 48, 5);
      // Specchietti bianchi
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-26, -66, 4, 6);
      ctx.fillRect(22, -66, 4, 6);

      // Pilota: Schiena con tuta tricolore
      ctx.fillStyle = "#EA141D"; // Tuta Rossa
      ctx.beginPath();
      ctx.ellipse(0, -68, 16, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-12, -72, 24, 4);

      // Casco con visiera
      ctx.fillStyle = "#00A1DE";
      ctx.beginPath();
      ctx.arc(0, -84, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#0f172a"; // Visiera fumé
      ctx.fillRect(-9, -82, 18, 6);

      ctx.restore();
    }

    // Render Ciclo Grafico Scanline Prospettico
    function draw() {
      // Cielo crepuscolare
      const skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON);
      skyGrad.addColorStop(0, "#081026");
      skyGrad.addColorStop(1, "#1e3a8a");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, HORIZON);

      // Colline Ardenne a sfondo continuo
      ctx.fillStyle = "#071321";
      ctx.beginPath();
      ctx.moveTo(0, HORIZON);
      for (let hx = 0; hx <= W; hx += 40) {
        ctx.lineTo(hx, HORIZON - 28 - Math.sin((hx + pos * 0.005) * 0.03) * 20);
      }
      ctx.lineTo(W, HORIZON);
      ctx.fill();

      // Proiezione Scanline 2.5D
      const baseSegIndex = Math.floor(pos / segLength) % segments.length;
      let maxy = H;
      const camH = 1100, camD = 0.85;
      let x = 0, dx = 0;

      for (let n = 0; n < 90; n++) {
        const seg = segments[(baseSegIndex + n) % segments.length];
        const loop = (baseSegIndex + n) >= segments.length;
        const camZ = pos - (loop ? segments.length * segLength : 0);

        const z1 = seg.z - camZ;
        if (z1 <= 0) continue;
        const sc1 = camD / z1;

        const z2 = seg.z + segLength - camZ;
        if (z2 <= 0) continue;
        const sc2 = camD / z2;

        const p1x = (W / 2) + (x - playerX * 1300) * sc1;
        const p1y = HORIZON + (camH - seg.y) * sc1;
        const p1w = 1400 * sc1;

        const p2x = (W / 2) + (x + dx - playerX * 1300) * sc2;
        const p2y = HORIZON + (camH - seg.y) * sc2;
        const p2w = 1400 * sc2;

        x += dx;
        dx += seg.curve * 1.6;

        if (p1y >= maxy || p2y >= p1y) continue;

        // Erba a bordo pista
        ctx.fillStyle = (seg.index % 2 === 0) ? "#14532d" : "#166534";
        ctx.fillRect(0, p2y, W, p1y - p2y);

        // Asfalto
        ctx.fillStyle = (seg.index % 2 === 0) ? "#334155" : "#1e293b";
        ctx.beginPath();
        ctx.moveTo(p1x - p1w, p1y);
        ctx.lineTo(p1x + p1w, p1y);
        ctx.lineTo(p2x + p2w, p2y);
        ctx.lineTo(p2x - p2w, p2y);
        ctx.fill();

        // Cordoli Tricolori Lussemburgo (Rosso, Bianco, Celeste)
        const flagColors = ["#EA141D", "#FFFFFF", "#00A1DE"];
        ctx.fillStyle = flagColors[seg.index % 3];
        const cw1 = p1w * 0.14, cw2 = p2w * 0.14;
        ctx.beginPath();
        ctx.moveTo(p1x - p1w, p1y);
        ctx.lineTo(p1x - p1w + cw1, p1y);
        ctx.lineTo(p2x - p2w + cw2, p2y);
        ctx.lineTo(p2x - p2w, p2y);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(p1x + p1w - cw1, p1y);
        ctx.lineTo(p1x + p1w, p1y);
        ctx.lineTo(p2x + p2w, p2y);
        ctx.lineTo(p2x + p2w - cw2, p2y);
        ctx.fill();

        // Linea mezzeria bianca
        if (seg.index % 2 === 0) {
          ctx.fillStyle = "#ffffff";
          const lw1 = p1w * 0.025, lw2 = p2w * 0.025;
          ctx.beginPath();
          ctx.moveTo(p1x - lw1, p1y);
          ctx.lineTo(p1x + lw1, p1y);
          ctx.lineTo(p2x + lw2, p2y);
          ctx.lineTo(p2x - lw2, p2y);
          ctx.fill();
        }

        // Alberi
        if (seg.tree !== 0) {
          drawTree(ctx, p1x + seg.tree * p1w, p1y, sc1 * 140);
        }

        // Auto
        if (seg.car) {
          drawCar(ctx, p1x + seg.car.offset * p1w, p1y, sc1 * 120);
        }

        // Bonus Leone Rosso
        if (seg.bonus) {
          const bs = sc1 * 150;
          if (bs > 0.6) {
            ctx.font = "bold " + Math.floor(18 * bs) + "px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🦁", p1x + seg.bonus.offset * p1w, p1y - 6 * bs);
          }
        }

        maxy = p2y;
      }

      // Moto del Giocatore in Piega Super Hang-On
      drawBike(ctx, W / 2, H - 35, lean);

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
