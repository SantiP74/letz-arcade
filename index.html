<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lëtz Hang-On - Grand Duchy Tour</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body {
      background: #0b1329;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 700px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #flag-top {
      height: 6px;
      width: 100%;
      display: flex;
      flex-shrink: 0;
    }
    .fl-r { flex: 1; background: #EA141D; }
    .fl-w { flex: 1; background: #FFFFFF; }
    .fl-b { flex: 1; background: #00A1DE; }

    #hud {
      position: absolute;
      top: 6px;
      left: 0;
      right: 0;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 19, 41, 0.85);
      border-bottom: 2px solid #334155;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.5px;
      z-index: 10;
    }
    .hud-val-spd { color: #00A1DE; font-size: 16px; }
    .hud-val-sc { color: #EA141D; font-size: 16px; }

    canvas {
      flex: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 19, 41, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 30;
    }
    #overlay h1 {
      font-size: 26px;
      font-weight: 900;
      color: #00A1DE;
      margin-bottom: 8px;
    }
    #overlay p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .btn-act {
      background: linear-gradient(135deg, #EA141D, #00A1DE);
      color: #fff;
      border: none;
      padding: 15px 34px;
      font-size: 17px;
      font-weight: 900;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0,161,222,0.4);
      cursor: pointer;
    }

    #touch-panel {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 12px;
      z-index: 20;
    }
    .t-btn {
      flex: 1;
      padding: 18px 0;
      font-size: 18px;
      font-weight: 900;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 2px solid #00A1DE;
      border-radius: 12px;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .t-btn:active { background: #00A1DE; color: #0b1329; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="flag-top">
      <div class="fl-r"></div>
      <div class="fl-w"></div>
      <div class="fl-b"></div>
    </div>

    <div id="hud">
      <div>SPEED: <b id="spd" class="hud-val-spd">0</b> KM/H</div>
      <div>SCORE: <b id="sc" class="hud-val-sc">0</b></div>
    </div>

    <canvas id="c" width="480" height="640"></canvas>

    <div id="overlay">
      <h1 id="ov-title">SUPER LËTZ-ON 🏍️</h1>
      <p id="ov-desc">Super Hang-On Luxembourg Tour!<br>Lean into curves, dodge traffic, collect the <b>Roude Léiw</b>!</p>
      <button class="btn-act" id="btn-start">START RACE 🏁</button>
    </div>

    <div id="touch-panel">
      <button class="t-btn" id="b-left">◀ LEAN LEFT</button>
      <button class="t-btn" id="b-right">LEAN RIGHT ▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const spdEl = document.getElementById("spd");
    const scEl = document.getElementById("sc");
    const overlay = document.getElementById("overlay");
    const ovTitle = document.getElementById("ov-title");
    const ovDesc = document.getElementById("ov-desc");
    const btnStart = document.getElementById("btn-start");
    const bLeft = document.getElementById("b-left");
    const bRight = document.getElementById("b-right");

    const W = 480, H = 640;
    const HORIZON = 240;
    let running = false;
    let speed = 0;
    const maxSpeed = 180;
    let score = 0, pos = 0, playerX = 0, lean = 0;
    let steerDir = 0;
    let lastTime = performance.now();

    const segLength = 200;
    const totalSegments = 600;
    const segments = [];

    for (let i = 0; i < totalSegments; i++) {
      let curve = 0;
      let y = 0;

      if (i > 40 && i < 110) curve = 2.4;
      if (i > 150 && i < 230) curve = -2.8;
      if (i > 280 && i < 360) curve = 3.2;

      if (i > 60 && i < 130) y = Math.sin((i - 60) / 70 * Math.PI) * 600;
      if (i > 200 && i < 290) y = Math.sin((i - 200) / 90 * Math.PI) * 750;

      // I primi 40 segmenti sono privi di ostacoli per evitare crash immediati
      const hasCar = (i > 40 && i % 25 === 0);
      const hasBonus = (i > 30 && i % 20 === 0 && !hasCar);

      segments.push({
        index: i,
        z: i * segLength,
        y: y,
        curve: curve,
        tree: (i % 6 === 0) ? (i % 12 === 0 ? 1.6 : -1.6) : 0,
        car: hasCar ? { offset: (Math.random() * 1.2 - 0.6) } : null,
        bonus: hasBonus ? { offset: (Math.random() * 1.0 - 0.5) } : null
      });
    }

    function start() {
      running = true;
      speed = 60;
      score = 0;
      pos = 0;
      playerX = 0;
      lean = 0;
      steerDir = 0;
      lastTime = performance.now();
      overlay.style.display = "none";
    }

    function crash() {
      running = false;
      speed = 0;
      overlay.style.display = "flex";
      ovTitle.innerText = "CRASH! 💥";
      ovDesc.innerText = "Final Score: " + score;
      btnStart.innerText = "PLAY AGAIN 🔄";
    }

    btnStart.addEventListener("click", start);
    btnStart.addEventListener("touchstart", (e) => { e.preventDefault(); start(); });

    function bindSteer(el, dir) {
      el.addEventListener("touchstart", (e) => { e.preventDefault(); steerDir = dir; }, { passive: false });
      el.addEventListener("touchend", (e) => { e.preventDefault(); if (steerDir === dir) steerDir = 0; });
      el.addEventListener("mousedown", () => { steerDir = dir; });
      el.addEventListener("mouseup", () => { if (steerDir === dir) steerDir = 0; });
      el.addEventListener("mouseleave", () => { if (steerDir === dir) steerDir = 0; });
    }
    bindSteer(bLeft, -1);
    bindSteer(bRight, 1);

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") steerDir = -1;
      if (e.code === "ArrowRight" || e.code === "KeyD") steerDir = 1;
      if (e.code === "Space" && !running) start();
    });
    window.addEventListener("keyup", (e) => {
      if ((e.code === "ArrowLeft" || e.code === "KeyA") && steerDir === -1) steerDir = 0;
      if ((e.code === "ArrowRight" || e.code === "KeyD") && steerDir === 1) steerDir = 0;
    });

    function drawTree(ctx, x, y, scale) {
      if (scale <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale * 1.4, scale * 1.4);
      ctx.fillStyle = "#451a03";
      ctx.fillRect(-5, -28, 10, 28);
      ctx.fillStyle = "#14532d";
      ctx.beginPath();
      ctx.arc(0, -56, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#166534";
      ctx.beginPath();
      ctx.arc(-7, -60, 16, 0, Math.PI * 2);
      ctx.arc(7, -60, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCar(ctx, x, y, scale) {
      if (scale <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale * 1.6, scale * 1.6);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.roundRect(-20, -24, 40, 22, 4);
      ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-15, -21, 30, 10);
      ctx.fillStyle = "#111";
      ctx.fillRect(-20, -7, 7, 7);
      ctx.fillRect(13, -7, 7, 7);
      ctx.fillStyle = "#facc15";
      ctx.fillRect(-17, -11, 6, 4);
      ctx.fillRect(11, -11, 6, 4);
      ctx.restore();
    }

    function drawBike(ctx, x, y, tilt) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);

      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.ellipse(0, 4, 28, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-11, -40, 22, 42);
      ctx.fillStyle = "#334155";
      ctx.fillRect(-5, -32, 10, 26);

      ctx.fillStyle = "#cbd5e1";
      ctx.fillRect(11, -24, 5, 20);

      ctx.fillStyle = "#00A1DE";
      ctx.beginPath();
      ctx.roundRect(-15, -55, 30, 22, 4);
      ctx.fill();
      ctx.fillStyle = "#EA141D";
      ctx.fillRect(-11, -51, 22, 7);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(-7, -34, 14, 4);

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(-22, -61, 44, 5);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-24, -63, 4, 5);
      ctx.fillRect(20, -63, 4, 5);

      ctx.fillStyle = "#EA141D";
      ctx.beginPath();
      ctx.ellipse(0, -65, 15, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-11, -69, 22, 4);

      ctx.fillStyle = "#00A1DE";
      ctx.beginPath();
      ctx.arc(0, -80, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-8, -78, 16, 5);

      ctx.restore();
    }

    function mainLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (running) {
        if (speed < maxSpeed) speed += 15 * dt;
        pos += speed * 60 * dt;

        if (steerDir !== 0) {
          playerX += steerDir * 1.8 * dt;
          lean += (steerDir * 0.42 - lean) * 8 * dt;
        } else {
          lean += (0 - lean) * 8 * dt;
        }

        if (playerX < -1.1 || playerX > 1.1) {
          speed = Math.max(35, speed - 60 * dt);
        }

        score += Math.floor(speed * dt * 0.5);
        spdEl.innerText = Math.floor(speed);
        scEl.innerText = score;

        const curIndex = Math.floor(pos / segLength) % segments.length;
        const curSeg = segments[curIndex];
        playerX -= (curSeg.curve * 0.15) * (speed / maxSpeed) * dt;

        if (curSeg.car && Math.abs(playerX - curSeg.car.offset) < 0.24) {
          crash();
        }
        if (curSeg.bonus && Math.abs(playerX - curSeg.bonus.offset) < 0.3) {
          score += 150;
          scEl.innerText = score;
          curSeg.bonus = null;
        }
      }

      // Disegno
      const skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON);
      skyGrad.addColorStop(0, "#081026");
      skyGrad.addColorStop(1, "#1e3a8a");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, HORIZON);

      ctx.fillStyle = "#071321";
      ctx.beginPath();
      ctx.moveTo(0, HORIZON);
      for (let hx = 0; hx <= W; hx += 40) {
        ctx.lineTo(hx, HORIZON - 24 - Math.sin((hx + pos * 0.002) * 0.03) * 16);
      }
      ctx.lineTo(W, HORIZON);
      ctx.fill();

      const baseSegIndex = Math.floor(pos / segLength) % segments.length;
      let maxy = H;
      const camH = 1100, camD = 0.85;
      let x = 0, dx = 0;

      for (let n = 0; n < 80; n++) {
        const seg = segments[(baseSegIndex + n) % segments.length];
        const loop = (baseSegIndex + n) >= segments.length;
        const camZ = pos - (loop ? segments.length * segLength : 0);

        const z1 = seg.z - camZ;
        if (z1 <= 0) continue;
        const sc1 = camD / z1;

        const z2 = seg.z + segLength - camZ;
        if (z2 <= 0) continue;
        const sc2 = camD / z2;

        const p1x = (W / 2) + (x - playerX * 1300) * sc1;
        const p1y = HORIZON + (camH - seg.y) * sc1;
        const p1w = 1400 * sc1;

        const p2x = (W / 2) + (x + dx - playerX * 1300) * sc2;
        const p2y = HORIZON + (camH - seg.y) * sc2;
        const p2w = 1400 * sc2;

        x += dx;
        dx += seg.curve * 1.5;

        if (p1y >= maxy || p2y >= p1y) continue;

        ctx.fillStyle = (seg.index % 2 === 0) ? "#14532d" : "#166534";
        ctx.fillRect(0, p2y, W, p1y - p2y);

        ctx.fillStyle = (seg.index % 2 === 0) ? "#334155" : "#1e293b";
        ctx.beginPath();
        ctx.moveTo(p1x - p1w, p1y);
        ctx.lineTo(p1x + p1w, p1y);
        ctx.lineTo(p2x + p2w, p2y);
        ctx.lineTo(p2x - p2w, p2y);
        ctx.fill();

        const flagColors = ["#EA141D", "#FFFFFF", "#00A1DE"];
        ctx.fillStyle = flagColors[seg.index % 3];
        const cw1 = p1w * 0.14, cw2 = p2w * 0.14;
        ctx.beginPath();
        ctx.moveTo(p1x - p1w, p1y);
        ctx.lineTo(p1x - p1w + cw1, p1y);
        ctx.lineTo(p2x - p2w + cw2, p2y);
        ctx.lineTo(p2x - p2w, p2y);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(p1x + p1w - cw1, p1y);
        ctx.lineTo(p1x + p1w, p1y);
        ctx.lineTo(p2x + p2w, p2y);
        ctx.lineTo(p2x + p2w - cw2, p2y);
        ctx.fill();

        if (seg.index % 2 === 0) {
          ctx.fillStyle = "#ffffff";
          const lw1 = p1w * 0.025, lw2 = p2w * 0.025;
          ctx.beginPath();
          ctx.moveTo(p1x - lw1, p1y);
          ctx.lineTo(p1x + lw1, p1y);
          ctx.lineTo(p2x + lw2, p2y);
          ctx.lineTo(p2x - lw2, p2y);
          ctx.fill();
        }

        if (seg.tree !== 0) {
          drawTree(ctx, p1x + seg.tree * p1w, p1y, sc1 * 130);
        }

        if (seg.car) {
          drawCar(ctx, p1x + seg.car.offset * p1w, p1y, sc1 * 110);
        }

        if (seg.bonus) {
          const bs = sc1 * 140;
          if (bs > 0.5) {
            ctx.font = "bold " + Math.floor(16 * bs) + "px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🦁", p1x + seg.bonus.offset * p1w, p1y - 6 * bs);
          }
        }

        maxy = p2y;
      }

      drawBike(ctx, W / 2, H - 35, lean);
      requestAnimationFrame(mainLoop);
    }

    requestAnimationFrame(mainLoop);
  </script>
</body>
</html>
